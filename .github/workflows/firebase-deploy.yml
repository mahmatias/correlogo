name: Build and Deploy APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create .env file from secret (base64 decoded)
        run: base64 -d <<< "${{ secrets.ENV_FILE }}" > .env

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app (Vite)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore keystore
        run: |
          mkdir -p android/app
          base64 -d <<< "${{ secrets.KEYSTORE_BASE64 }}" > android/app/keystore.jks
          ls -lah android/app/keystore.jks

      - name: Compute version code
        run: echo "CI_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> $GITHUB_ENV

      - name: Build release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            -PciVersionCode=$CI_VERSION_CODE
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK was built
        run: ls -lah android/app/build/outputs/apk/release/app-release.apk

      - name: Restore Firebase service account (base64 decoded)
        run: base64 -d <<< "${{ secrets.FIREBASE_CREDENTIALS }}" > firebase-key.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload APK to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-key.json
        run: |
          firebase appdistribution:distribute \
            android/app/build/outputs/apk/release/app-release.apk \
            --app="${{ secrets.FIREBASE_APP_ID }}" \
            --release-notes-file=RELEASE_NOTES.txt \
            --groups="testers"

      - name: Upload APK to GitHub Release (in-app update)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "{\"versionCode\":$CI_VERSION_CODE,\"versionName\":\"$VERSION_NAME\",\"downloadUrl\":\"https://github.com/mahmatias/correlogo/releases/download/latest/app-release.apk\"}" > /tmp/update-manifest.json
          # Move the 'latest' tag to HEAD so the release points to this commit
          git tag -f latest HEAD
          git push origin latest --force 2>/dev/null || true
          if gh release view latest --json tagName > /dev/null 2>&1; then
            gh release upload latest --clobber \
              android/app/build/outputs/apk/release/app-release.apk \
              /tmp/update-manifest.json
          else
            gh release create latest --notes "Build #$CI_VERSION_CODE" --title "Latest" \
              android/app/build/outputs/apk/release/app-release.apk \
              /tmp/update-manifest.json
          fi
          echo "Release URL: https://github.com/mahmatias/correlogo/releases/tag/latest"

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f android/app/keystore.jks firebase-key.json

      - name: Notify success
        if: success()
        run: echo "Deploy realizado com sucesso!"

      - name: Notify failure
        if: failure()
        run: echo "Deploy falhou. Verifique os logs acima."
