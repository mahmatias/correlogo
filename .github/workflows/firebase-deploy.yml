name: Build and Deploy APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create .env file from secret (base64 decoded)
        run: base64 -d <<< "${{ secrets.ENV_FILE }}" > .env

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app (Vite)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore keystore
        run: |
          mkdir -p android/app
          base64 -d <<< "${{ secrets.KEYSTORE_BASE64 }}" > android/app/keystore.jks
          ls -lah android/app/keystore.jks

      - name: Build release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK was built
        run: ls -lah android/app/build/outputs/apk/release/app-release.apk

      - name: Restore Firebase service account (base64 decoded)
        run: base64 -d <<< "${{ secrets.FIREBASE_CREDENTIALS }}" > firebase-key.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase App Distribution
        run: |
          firebase appdistribution:distribute \
            android/app/build/outputs/apk/release/app-release.apk \
            --app="${{ secrets.FIREBASE_APP_ID }}" \
            --release-notes-file=RELEASE_NOTES.txt \
            --groups="testers" \
            --service-account-file=firebase-key.json

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f android/app/keystore.jks firebase-key.json

      - name: Notify success
        if: success()
        run: echo "Deploy realizado com sucesso!"

      - name: Notify failure
        if: failure()
        run: echo "Deploy falhou. Verifique os logs acima."
